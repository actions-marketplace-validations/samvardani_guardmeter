[mypy]
python_version = 3.11

# Enabled strict mode features
warn_unused_configs = True
disallow_any_generics = True
no_implicit_optional = True
warn_redundant_casts = True
strict_equality = True

# Gradual typing compatibility
warn_unused_ignores = False
disallow_untyped_defs = False
allow_untyped_calls = True
allow_untyped_defs = True
allow_incomplete_defs = False

# Third-party library handling
ignore_missing_imports = True

# Disable specific error codes for gradual typing
disable_error_code = no-untyped-def, no-any-return, unreachable, annotation-unchecked

# Third-party libraries
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True
