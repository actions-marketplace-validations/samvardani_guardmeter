name: GuardBench CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  guardbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install guardbench
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check guardbench tests
      - name: Type check (mypy)
        run: mypy guardbench
      - name: Run tests
        run: pytest tests/guardbench/ --cov=guardbench -q
      - name: Compare guards
        run: guardbench compare --baseline regex-baseline --candidate regex-enhanced --dataset dataset/sample.csv
      - name: Generate report
        run: guardbench report --run latest
      - name: Build dashboard
        run: guardbench dashboard --no-open
      - name: Run CI gate
        run: guardbench gate --config gate.json --run latest
