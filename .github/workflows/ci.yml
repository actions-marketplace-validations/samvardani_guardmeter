name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  guardmeter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check guardmeter tests
      - name: Type check (mypy)
        run: mypy guardmeter
      - name: Run tests
        run: pytest tests/guardmeter/ --cov=guardmeter -q
      - name: Compare guards
        run: guardmeter compare --baseline regex-baseline --candidate regex-enhanced --dataset dataset/sample.csv
      - name: Generate report
        run: guardmeter report --run latest
      - name: Build dashboard
        run: guardmeter dashboard --no-open
      - name: Run CI gate
        run: guardmeter gate --config gate.json --run latest
