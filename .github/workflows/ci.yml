name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install guardmeter
        # The llm extra (openai, anthropic) is needed to import the hosted-guard
        # tests (ollama/nvidia); without it they raise ModuleNotFoundError.
        run: pip install -e ".[dev,llm]"
      - name: Lint (ruff)
        run: ruff check guardmeter tests
      - name: Type check (mypy)
        run: mypy guardmeter
      - name: Run tests
        run: pytest tests/guardmeter/ --cov=guardmeter --cov-fail-under=80 -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Compare guards
        run: guardmeter compare --baseline regex-baseline --candidate regex-enhanced --dataset dataset/sample.csv
      - name: Generate report
        run: guardmeter report --run latest
      - name: Build dashboard
        run: guardmeter dashboard --no-open
      - name: Run CI gate
        run: guardmeter gate --config gate.json --run latest
      - name: Verify report integrity
        run: guardmeter verify-report report

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Validate sample dataset
        run: guardmeter dataset validate dataset/sample.csv
      - name: Validate agentic dataset
        run: guardmeter dataset validate dataset/agentic/v1/data.jsonl
      - name: Validate agentic dataset v2 (multilingual)
        run: guardmeter dataset validate dataset/agentic/v2/data.jsonl

  # Non-required: reports where the shipped guards stand on the agentic dataset
  # against an aspirational injection gate. Expected to fail today (no shipped
  # guard detects injection) — continue-on-error keeps the gap visible without
  # blocking merges. See docs/AGENTIC_RESULTS.md.
  agentic:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Compare on agentic dataset
        run: guardmeter compare --baseline injection-heuristic --candidate regex-enhanced --dataset dataset/agentic/v1/data.jsonl
      - name: Aspirational injection gate (non-required)
        run: guardmeter gate --config dataset/agentic/v1/gate.agentic.json --run latest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (fail on known vulnerabilities)
        run: pip-audit

  starter:
    # Prove the agent-release-check starter ships in the wheel and works from a
    # clean install — no repo checkout on the path, exactly what a customer gets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/wheelhouse
      - name: Install the wheel into a clean venv (outside the repo)
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install /tmp/wheelhouse/*.whl
      - name: init --agent and audit from a directory that is not the repo
        run: |
          mkdir -p /tmp/customer && cd /tmp/customer
          /tmp/cleanenv/bin/guardmeter init --agent
          test -f agent-release-check/starter.yaml
          test -f agent-release-check/gate.json
          test -f agent-release-check/README.md
          # Audit is offline (static + NullTarget); assert zero cannot-fail / unreviewed.
          /tmp/cleanenv/bin/guardmeter scenarios audit agent-release-check/starter.yaml \
            --out val.md | tee audit.out
          grep -q "unreviewed=0 cannot_fail=0" audit.out
