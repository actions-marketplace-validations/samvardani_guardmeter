name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check guardmeter tests
      - name: Type check (mypy)
        run: mypy guardmeter
      - name: Run tests
        run: pytest tests/guardmeter/ --cov=guardmeter --cov-fail-under=80 -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install guardmeter
        run: pip install -e ".[dev]"
      - name: Compare guards
        run: guardmeter compare --baseline regex-baseline --candidate regex-enhanced --dataset dataset/sample.csv
      - name: Generate report
        run: guardmeter report --run latest
      - name: Build dashboard
        run: guardmeter dashboard --no-open
      - name: Run CI gate
        run: guardmeter gate --config gate.json --run latest
