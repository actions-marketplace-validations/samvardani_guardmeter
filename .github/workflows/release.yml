name: Release
on:
  push:
    tags:
      - "v*"
      - "sea-guard-v*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install build
      - name: Build guardmeter (repo root)
        if: startsWith(github.ref_name, 'v')
        run: python -m build
      - name: Build sea-guard tombstone
        if: startsWith(github.ref_name, 'sea-guard-v')
        working-directory: legacy/sea-guard
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
      # Agentic datasets are repo artifacts, not part of the wheel — attach the
      # current dataset's files as release assets so `guardmeter dataset fetch`
      # can download them. fetch.py pins each dataset to the release tag that
      # froze it (v1 → v0.7.0, v2 → v0.10.0); v2 is the one cut with this tag.
      - name: Stage dataset release assets
        if: startsWith(github.ref_name, 'v')
        run: |
          mkdir -p release-assets
          cp dataset/agentic/v2/data.jsonl release-assets/
          cp dataset/agentic/v2/DATASET_CARD.md release-assets/
          cp dataset/agentic/v2/gate.agentic.json release-assets/
          cp dataset/agentic/v2/LICENSE release-assets/
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref_name, 'v')
        with: { name: release-assets, path: release-assets/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Dataset assets live in a separate artifact so they never reach PyPI.
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'v')
        continue-on-error: true
        with: { name: release-assets, path: release-assets/ }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release-assets/*
          generate_release_notes: true
