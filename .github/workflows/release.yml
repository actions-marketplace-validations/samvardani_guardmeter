name: Release
on:
  push:
    tags:
      - "v*"
      - "sea-guard-v*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install build
      - name: Build guardmeter (repo root)
        if: startsWith(github.ref_name, 'v')
        run: python -m build
      - name: Build sea-guard tombstone
        if: startsWith(github.ref_name, 'sea-guard-v')
        working-directory: legacy/sea-guard
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
      # Agentic dataset is a repo artifact, not part of the wheel — attach it as
      # release assets so `guardmeter dataset fetch agentic-v1` can download it.
      - name: Stage dataset release assets
        if: startsWith(github.ref_name, 'v')
        run: |
          mkdir -p release-assets
          cp dataset/agentic/v1/data.jsonl release-assets/
          cp dataset/agentic/v1/DATASET_CARD.md release-assets/
          cp dataset/agentic/v1/gate.agentic.json release-assets/
          cp dataset/agentic/v1/LICENSE release-assets/
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref_name, 'v')
        with: { name: release-assets, path: release-assets/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Dataset assets live in a separate artifact so they never reach PyPI.
      - uses: actions/download-artifact@v8
        if: startsWith(github.ref_name, 'v')
        continue-on-error: true
        with: { name: release-assets, path: release-assets/ }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            release-assets/*
          generate_release_notes: true
