<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GuardMeter Playground</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; background:#0f172a; color:#e2e8f0;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between;
             padding:14px 24px; background:#1e293b; border-bottom:1px solid #334155; }
    header .brand { display:flex; align-items:center; gap:12px; }
    header .wm { font-size:18px; font-weight:700; }
    header a { color:#818cf8; text-decoration:none; font-size:14px; }
    header a:hover { text-decoration:underline; }
    main { max-width:960px; margin:0 auto; padding:24px; }
    textarea { width:100%; min-height:130px; resize:vertical; background:#1e293b;
               color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:12px;
               font-size:14px; font-family:inherit; }
    textarea:focus { outline:none; border-color:#818cf8; }
    .guards { display:flex; flex-wrap:wrap; gap:14px; margin:14px 0; }
    .guards label { display:flex; align-items:center; gap:6px; font-size:13px; color:#cbd5e1; cursor:pointer; }
    input[type="checkbox"] { accent-color:#818cf8; }
    .actions { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
    button { background:#4f46e5; color:#fff; border:0; border-radius:8px; padding:9px 18px;
             font-size:14px; font-weight:600; cursor:pointer; }
    button:hover { background:#4338ca; }
    button:disabled { opacity:0.6; cursor:default; }
    .hint { color:#64748b; font-size:12px; }
    table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
    th { background:#1e293b; color:#94a3b8; font-weight:600; text-align:left; padding:8px 10px; }
    td { padding:8px 10px; border-bottom:1px solid #1e293b; }
    .v-flag { color:#f87171; font-weight:700; }
    .v-pass { color:#4ade80; font-weight:700; }
    .v-error { color:#fbbf24; font-weight:700; }
    code { background:#1e293b; padding:2px 6px; border-radius:4px; font-size:12px; }
    .section-title { font-size:13px; font-weight:600; color:#94a3b8; text-transform:uppercase;
                     letter-spacing:0.05em; margin:26px 0 8px; }
    .history { list-style:none; margin:0; padding:0; }
    .history li { display:flex; align-items:center; gap:10px; padding:7px 10px; border-bottom:1px solid #1e293b;
                  cursor:pointer; font-size:13px; }
    .history li:hover { background:#1e293b55; }
    .history .txt { color:#cbd5e1; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chip { display:inline-flex; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; }
    .chip-flag { background:#7f1d1d33; color:#f87171; }
    .chip-pass { background:#14532d33; color:#4ade80; }
    .chip-error { background:#78350f33; color:#fbbf24; }
    .err-msg { color:#fbbf24; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="34" height="34">
        <defs>
          <linearGradient id="nb-sg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f2744"/><stop offset="100%" style="stop-color:#0a1f3d"/>
          </linearGradient>
          <linearGradient id="nb-cg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22d3ee"/><stop offset="100%" style="stop-color:#06b6d4"/>
          </linearGradient>
        </defs>
        <path d="M60 8 L100 24 L100 62 Q100 90 60 112 Q20 90 20 62 L20 24 Z" fill="url(#nb-sg)" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>
        <polyline points="44,60 56,72 76,48" fill="none" stroke="url(#nb-cg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wm"><span style="color:#f0f9ff">Guard</span><span style="color:#22d3ee">Meter</span> <span style="color:#64748b;font-weight:500">Playground</span></span>
    </div>
    <a href="/dashboard">Dashboard →</a>
  </header>

  <main>
    <textarea id="text" placeholder="Paste a prompt or model output…"></textarea>
    <div class="guards" id="guards"></div>
    <div class="actions">
      <button id="evaluate">Evaluate</button>
      <span class="hint">or press ⌘/Ctrl + Enter</span>
    </div>

    <table id="results" style="display:none">
      <thead><tr><th>Guard</th><th>Verdict</th><th>Score</th><th>Categories</th><th>Latency</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>

    <div id="history-wrap" style="display:none">
      <div class="section-title">History (last 20)</div>
      <ul class="history" id="history"></ul>
    </div>
  </main>

  <script>
    function esc(s){return String(s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}

    var DEFAULT_GUARDS = ["regex-baseline", "regex-enhanced"];
    var history = [];

    /* Token is kept only in sessionStorage and sent as a Bearer header — never
       placed in the URL. On a 401 we prompt once and retry. */
    function withAuth(opts){
      opts = opts || {};
      var h = opts.headers || {};
      var t = sessionStorage.getItem('gm_token');
      if (t) h['Authorization'] = 'Bearer ' + t;
      opts.headers = h;
      return opts;
    }
    function apiFetch(url, opts){
      return fetch(url, withAuth(opts)).then(function(r){
        if (r.status !== 401) return r;
        var t = window.prompt('This playground requires a token (GUARDMETER_TOKEN):');
        if (!t) return r;
        sessionStorage.setItem('gm_token', t);
        return fetch(url, withAuth(opts));
      });
    }

    function verdictCell(r){
      if (r.error) return '<span class="v-error">ERROR</span>';
      return r.prediction === 'flag'
        ? '<span class="v-flag">FLAG</span>'
        : '<span class="v-pass">PASS</span>';
    }
    function chip(r){
      if (r.error) return '<span class="chip chip-error">ERROR</span>';
      return r.prediction === 'flag'
        ? '<span class="chip chip-flag">FLAG</span>'
        : '<span class="chip chip-pass">PASS</span>';
    }

    function selectedGuards(){
      return Array.prototype.slice.call(document.querySelectorAll('.guards input:checked'))
        .map(function(cb){ return cb.value; });
    }

    function loadGuards(){
      return apiFetch('/api/guards').then(function(r){ return r.json(); }).then(function(data){
        var checked = data.default || DEFAULT_GUARDS;
        var wrap = document.getElementById('guards');
        wrap.innerHTML = (data.guards || []).map(function(name){
          var on = checked.indexOf(name) !== -1 ? ' checked' : '';
          return '<label><input type="checkbox" value="' + esc(name) + '"' + on + '> ' + esc(name) + '</label>';
        }).join('');
      });
    }

    function renderResults(results){
      var body = document.getElementById('results-body');
      body.innerHTML = results.map(function(r){
        var cats = (r.categories && r.categories.length) ? esc(r.categories.join(', ')) : '—';
        var score = (r.score === null || r.score === undefined) ? '—' : Number(r.score).toFixed(2);
        var lat = Number(r.latency_ms).toFixed(1) + ' ms';
        var row = '<tr><td>' + esc(r.guard) + '</td><td>' + verdictCell(r) + '</td><td>' +
                  score + '</td><td>' + cats + '</td><td>' + lat + '</td></tr>';
        if (r.error) {
          row += '<tr><td></td><td colspan="4" class="err-msg">' + esc(r.error) + '</td></tr>';
        }
        return row;
      }).join('');
      document.getElementById('results').style.display = results.length ? 'table' : 'none';
    }

    function pushHistory(text, results){
      history.unshift({ text: text, results: results });
      if (history.length > 20) history.length = 20;
      var ul = document.getElementById('history');
      ul.innerHTML = history.map(function(h, i){
        var chips = h.results.map(chip).join(' ');
        var t = h.text.length > 80 ? h.text.slice(0, 80) + '…' : h.text;
        return '<li data-i="' + i + '"><span class="txt">' + esc(t) + '</span>' + chips + '</li>';
      }).join('');
      document.getElementById('history-wrap').style.display = history.length ? 'block' : 'none';
      Array.prototype.forEach.call(ul.querySelectorAll('li'), function(li){
        li.onclick = function(){
          var h = history[parseInt(li.getAttribute('data-i'), 10)];
          document.getElementById('text').value = h.text;
          renderResults(h.results);
        };
      });
    }

    function evaluate(){
      var text = document.getElementById('text').value;
      if (!text) return;
      var btn = document.getElementById('evaluate');
      btn.disabled = true;
      apiFetch('/api/try', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, guards: selectedGuards() }),
      }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
        .then(function(res){
          if (!res.ok) { alert('Error: ' + (res.j.error || 'request failed')); return; }
          renderResults(res.j);
          pushHistory(text, res.j);
        })
        .catch(function(e){ alert('Request failed: ' + e); })
        .then(function(){ btn.disabled = false; });
    }

    document.getElementById('evaluate').addEventListener('click', evaluate);
    document.getElementById('text').addEventListener('keydown', function(e){
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); evaluate(); }
    });

    loadGuards().then(function(){
      // Honour ?text= for pre-filled, auto-evaluated links (used by docs/screenshots).
      var params = new URLSearchParams(window.location.search);
      var pre = params.get('text');
      if (pre) { document.getElementById('text').value = pre; evaluate(); }
    });
  </script>
</body>
</html>
