[project]
name = "guardmeter"
version = "0.3.0"
description = "Benchmark, compare, and gate AI safety guards"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai-safety", "guardrails", "evaluation", "benchmark", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["openai", "anthropic"]
hf = ["datasets", "transformers"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
guardmeter = "guardmeter.cli.main:cli"

[project.urls]
Homepage = "https://github.com/samvardani/guardmeter"
Repository = "https://github.com/samvardani/guardmeter"
Changelog = "https://github.com/samvardani/guardmeter/blob/main/CHANGELOG.md"
Issues = "https://github.com/samvardani/guardmeter/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardmeter*"]

[tool.setuptools.package-data]
"guardmeter.report.templates" = ["*.html"]
"guardmeter.data.builtin" = ["*.csv", "*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests/guardmeter"]
addopts = "--tb=short"
